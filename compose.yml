name: deiz-memory
services:
  postgres:
    # pgvector y no postgres a secas: §8 siempre dijo "Postgres + pgvector", y
    # F3 lo necesita. Una sola base para lo estructurado, el full-text y los
    # vectores — un motor, un backup.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deiz
      POSTGRES_PASSWORD: deiz
      POSTGRES_DB: deiz_memory
    # 127.0.0.1 y no 0.0.0.0: esta base tiene fichas médicas y no tiene por qué
    # ser alcanzable desde la red (§14).
    #
    # Y 5455 y no 5433 por una razón menos obvia que costó un rato encontrar: el
    # 5433 lo tomaba otro proyecto en esta misma máquina. Docker no falló al
    # arrancar — dejó el contenedor vivo **sin publicar el puerto**, así que
    # `localhost:5433` seguía respondiendo... apuntando a la base equivocada. Se
    # salvó porque la contraseña no coincidía. Un puerto poco disputado es más
    # barato que descubrir eso corriendo una migración.
    ports: ["127.0.0.1:5455:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deiz -d deiz_memory"]
      interval: 2s
      timeout: 3s
      retries: 30
  garage:
    image: dxflrs/garage:v1.0.1
    ports: ["3900:3900", "3903:3903"]
    volumes:
      - "./garage/garage.toml:/etc/garage.toml:ro"
      - "garagemeta:/var/lib/garage/meta"
      - "garagedata:/var/lib/garage/data"
  # Los tres carriles de §8.1, uno por servicio.
  #
  # Todos publican en 127.0.0.1 y no en 0.0.0.0: procesan documentos médicos y
  # financieros, y no tienen por qué ser alcanzables desde fuera del host (§14).

  # Carril A: convierte documentos y rasteriza PDF para el carril B.
  documents:
    build: ./services/documents
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8000"]

  # Carril B por defecto: OCR local, gratis, sin red y reproducible.
  ocr:
    build: ./services/ocr
    restart: unless-stopped
    ports: ["127.0.0.1:8083:8000"]

  # Carril C. API nativa de OpenAI, que es lo que habla el adapter: cambiar de
  # motor de transcripción es cambiar una URL.
  #
  # El modelo importa más que el motor: en español `base` da 18.4% de WER y
  # `small` 9.7%. Con 18% se destrozan justo los nombres propios y los números,
  # o sea lo único que uno guarda. `small` es el piso razonable, y por eso se
  # sobreescribe el default `base` de la imagen.
  whisper:
    image: hwdsl2/whisper-server:latest
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${DM_SPEECH_MODEL_NAME:-small}
      WHISPER_LANGUAGE: ${DM_SPEECH_LANG:-es}
      # Vacío desactiva la autenticación, que acá es lo correcto: el puerto solo
      # escucha en localhost. Si prefieres llave igual, pon DM_SPEECH_API_KEY en
      # .env.local y la reciben los dos lados, servidor y cliente.
      WHISPER_API_KEY: ${DM_SPEECH_API_KEY:-}
    # Escucha en 9000, no en 8000 como los sidecars propios.
    ports: ["127.0.0.1:8082:9000"]
    volumes: ["whispermodels:/var/lib/whisper"]

  # El clasificador de F2. Local por decisión: clasificar es elegir entre ocho
  # categorías y escribir un título de cinco palabras, y para eso un modelo
  # chico rinde bien — a diferencia del OCR, donde fallaba justo en los dígitos.
  #
  # Nada sale del host, no cuesta por documento, y §14 deja de exigir verificar
  # la retención de un tercero antes de mandarle una receta.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollamamodels:/root/.ollama"]

  # ---------------------------------------------------------------- the app
  #
  # The app runs in containers too: nothing needs Node on the host. Both use the
  # same image and differ only in the command, because they are the same binary
  # doing two jobs — reading what arrives, and answering the chat.
  #
  # Every dependency is an environment variable with an in-network default, so
  # any service can be swapped for a hosted one by setting the URL and nothing
  # else. That is what makes "the model is a service, not an architectural
  # decision" true rather than aspirational.
  #
  # All three name `target: runtime` explicitly. Without it Docker builds the LAST
  # stage of the Dockerfile, which is `backup` — and the worker and the bot came
  # out as the backup image, carrying restic and trying to join a tailnet on
  # startup. A default that changes when someone appends a stage is not a default.
  app-migrate:
    build:
      context: .
      target: runtime
    profiles: ["setup"]
    depends_on:
      postgres: { condition: service_healthy }
    # Your provider keys live here and never in the compose. Values under
    # `environment` win over this file, which is exactly what is wanted: the
    # service URLs come from the network, the secrets come from you.
    env_file: &app-secrets
      - path: .env.local
        required: false
    environment: &app-env
      # A distinct name from the host's DATABASE_URL on purpose: compose loads
      # .env, and that file points at localhost:5455 for the CLI. Inside the
      # network the database is reached by service name, and letting the host
      # value win here made every container fail to connect.
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgres://deiz:deiz@postgres:5432/deiz_memory}
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-deiz-memory}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DM_DOCUMENTS_URL: ${DM_DOCUMENTS_URL_INTERNAL:-http://documents:8000}
      DM_OCR_URL: ${DM_OCR_URL_INTERNAL:-http://ocr:8000}
      DM_SPEECH_URL: ${DM_SPEECH_URL_INTERNAL:-http://whisper:9000/v1}
      DM_SPEECH_API_KEY: ${DM_SPEECH_API_KEY:-}
      DM_CLASSIFY_URL: ${DM_CLASSIFY_URL_INTERNAL:-http://ollama:11434/v1}
      DM_EMBED_URL: ${DM_EMBED_URL_INTERNAL:-http://ollama:11434}
      DM_CLASSIFY_MODEL: ${DM_CLASSIFY_MODEL:-qwen2.5:3b}
      DM_EMBED_MODEL: ${DM_EMBED_MODEL:-nomic-embed-text}
      DM_VISION_BACKEND: ${DM_VISION_BACKEND:-ocr}
      # The image carries no .env: the compose IS the configuration.
      DM_ENV_FILE: /dev/null
    command: ["init"]

  # Runs the lanes over whatever arrives. Restarts on its own, because the queue
  # is what holds the sub-second acknowledgement up.
  app-worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: *app-secrets
    environment: *app-env
    command: ["worker"]

  # Answers the chat. With no token it exits, which is correct: an unconfigured
  # channel is not a broken system, and the compose says so by leaving it out of
  # the default profile.
  app-bot:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    profiles: ["chat"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file: *app-secrets
    environment: *app-env
    command: ["serve"]

  # ------------------------------------------------------------- the backup
  #
  # Off-site, encrypted at origin, and out of every default profile: it runs when
  # you run it (§14.3). Not being on a timer is deliberate — §2 says the system
  # never acts on its own — and it is also the honest limitation, because a
  # backup from three months ago is nearly no backup.
  backup:
    # A stage of the same Dockerfile, so this is the same binary with restic,
    # rclone and a VPN client added — not a second implementation of the backup.
    build:
      context: .
      target: backup
    profiles: ["backup"]
    depends_on:
      postgres: { condition: service_healthy }
    env_file: *app-secrets
    # Database and object store come from the same place as the app, by network
    # name: the backup reads exactly what the system writes.
    #
    # And NOT ONE secret of its own here — not DM_BACKUP_PASSPHRASE, not the
    # WebDAV credentials, not TS_AUTHKEY. `environment` wins over `env_file`, and
    # compose interpolates from .env and the shell but never from .env.local, so
    # `TS_AUTHKEY: ${TS_AUTHKEY:-}` would resolve to the empty string and
    # overwrite the key sitting right there in the file, failing as "not set".
    # Same trap that made every container fail to reach the database in f689d8b.
    # Everything secret arrives through env_file and nowhere else.
    environment: *app-env
    volumes: ["backupdata:/data"]

volumes:
  pgdata:
  garagemeta:
  garagedata:
  whispermodels:
  ollamamodels:
  # restic's local cache. Not the data — the export is staged in a temp
  # directory and destroyed after every run, because a per-owner copy of the
  # corpus is not something to leave lying on the host. This is only the index
  # cache, and keeping it is the difference between a fast run and a full
  # re-read of the repository.
  backupdata:
