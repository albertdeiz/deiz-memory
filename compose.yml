name: deiz-memory
services:
  postgres:
    # pgvector y no postgres a secas: §8 siempre dijo "Postgres + pgvector", y
    # F3 lo necesita. Una sola base para lo estructurado, el full-text y los
    # vectores — un motor, un backup.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deiz
      POSTGRES_PASSWORD: deiz
      POSTGRES_DB: deiz_memory
    # 127.0.0.1 y no 0.0.0.0: esta base tiene fichas médicas y no tiene por qué
    # ser alcanzable desde la red (§14).
    #
    # Y 5455 y no 5433 por una razón menos obvia que costó un rato encontrar: el
    # 5433 lo tomaba otro proyecto en esta misma máquina. Docker no falló al
    # arrancar — dejó el contenedor vivo **sin publicar el puerto**, así que
    # `localhost:5433` seguía respondiendo... apuntando a la base equivocada. Se
    # salvó porque la contraseña no coincidía. Un puerto poco disputado es más
    # barato que descubrir eso corriendo una migración.
    ports: ["127.0.0.1:5455:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deiz -d deiz_memory"]
      interval: 2s
      timeout: 3s
      retries: 30
  garage:
    image: dxflrs/garage:v1.0.1
    ports: ["3900:3900", "3903:3903"]
    volumes:
      - "./garage/garage.toml:/etc/garage.toml:ro"
      - "garagemeta:/var/lib/garage/meta"
      - "garagedata:/var/lib/garage/data"
  # Los tres carriles de §8.1, uno por servicio.
  #
  # Todos publican en 127.0.0.1 y no en 0.0.0.0: procesan documentos médicos y
  # financieros, y no tienen por qué ser alcanzables desde fuera del host (§14).

  # Carril A: convierte documentos y rasteriza PDF para el carril B.
  documents:
    build: ./services/documents
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8000"]

  # Carril B por defecto: OCR local, gratis, sin red y reproducible.
  ocr:
    build: ./services/ocr
    restart: unless-stopped
    ports: ["127.0.0.1:8083:8000"]

  # Carril C. API nativa de OpenAI, que es lo que habla el adapter: cambiar de
  # motor de transcripción es cambiar una URL.
  #
  # El modelo importa más que el motor: en español `base` da 18.4% de WER y
  # `small` 9.7%. Con 18% se destrozan justo los nombres propios y los números,
  # o sea lo único que uno guarda. `small` es el piso razonable, y por eso se
  # sobreescribe el default `base` de la imagen.
  whisper:
    image: hwdsl2/whisper-server:latest
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${DM_SPEECH_MODEL_NAME:-small}
      WHISPER_LANGUAGE: ${DM_SPEECH_LANG:-es}
      # Vacío desactiva la autenticación, que acá es lo correcto: el puerto solo
      # escucha en localhost. Si prefieres llave igual, pon DM_SPEECH_API_KEY en
      # .env.local y la reciben los dos lados, servidor y cliente.
      WHISPER_API_KEY: ${DM_SPEECH_API_KEY:-}
    # Escucha en 9000, no en 8000 como los sidecars propios.
    ports: ["127.0.0.1:8082:9000"]
    volumes: ["whispermodels:/var/lib/whisper"]

  # El clasificador de F2. Local por decisión: clasificar es elegir entre ocho
  # categorías y escribir un título de cinco palabras, y para eso un modelo
  # chico rinde bien — a diferencia del OCR, donde fallaba justo en los dígitos.
  #
  # Nada sale del host, no cuesta por documento, y §14 deja de exigir verificar
  # la retención de un tercero antes de mandarle una receta.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollamamodels:/root/.ollama"]

volumes:
  pgdata:
  garagemeta:
  garagedata:
  whispermodels:
  ollamamodels:
